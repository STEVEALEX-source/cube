
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBE - Astronomy Picture of the Day</title>
    <!-- Retro Pixel Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* CRT Screen Filter Mode */
        body.crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Party Mode Rainbow Background */
        body.party-mode {
            animation: rainbowBg 1.5s infinite alternate;
        }

        /* Hyperspace Warp Mode */
        body.warp-mode #bg-overlay {
            animation: warpSpeed 0.2s infinite linear;
            background: repeating-radial-gradient(circle, #a5b4fc 0%, transparent 10%, #000 20%);
        }

        @keyframes rainbowBg {
            0% { background: #1e1035; }
            50% { background: #0c2340; }
            100% { background: #330b20; }
        }

        @keyframes warpSpeed {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Particle Canvas Layer */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9;
        }

        /* Dynamic Space Background */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            transition: opacity 0.3s;
        }

        /* Retro Arcade Pixel Overlay */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 50% 50%, rgba(10, 10, 20, 0.45) 0%, rgba(0, 0, 0, 0.95) 90%),
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.3),
                    rgba(0, 0, 0, 0.3) 2px,
                    transparent 2px,
                    transparent 4px
                );
        }

        /* Top Bar CRT Toggle */
        .crt-toggle-btn {
            position: absolute;
            top: -42px;
            left: 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.45rem;
            background: #1e1b4b;
            color: #a5b4fc;
            border: 2px solid #6366f1;
            padding: 6px 10px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000000;
        }

        .crt-toggle-btn:hover {
            background: #312e81;
            color: #ffffff;
        }

        /* Secret Party Banner */
        #partyBanner {
            display: none;
            position: absolute;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff79c6;
            color: #000000;
            font-size: 0.55rem;
            padding: 8px 16px;
            border: 3px solid #ffffff;
            box-shadow: 4px 4px 0px #000000;
            white-space: nowrap;
            z-index: 20;
            animation: bounceBanner 0.6s infinite alternate steps(2);
        }

        @keyframes bounceBanner {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-6px); }
        }

        /* MWIRL-Style Pixel Card */
        .card {
            background: rgba(12, 12, 20, 0.92);
            border: 4px solid #ffffff;
            box-shadow: 
                0 0 0 4px #000000,
                10px 10px 0px #000000,
                20px 20px 0px rgba(0, 0, 0, 0.7);
            padding: 36px 28px;
            max-width: 880px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Interactive Pixel Cat Positioned On Top Border */
        .pixel-cat-container {
            position: absolute;
            top: -42px;
            right: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            z-index: 15;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }

        .cat-sprite {
            width: 36px;
            height: 36px;
            image-rendering: pixelated;
            animation: idleBounce 1.2s infinite alternate steps(2);
            transition: transform 0.1s ease;
        }

        .pixel-cat-container:hover .cat-sprite {
            transform: scale(1.15) translateY(-2px);
        }

        .pixel-cat-container.meow-jump .cat-sprite {
            animation: catJump 0.35s ease-out;
        }

        .pixel-cat-container.sleeping .cat-sprite {
            animation: catSleep 2s infinite alternate ease-in-out;
            opacity: 0.85;
        }

        .pixel-cat-container.grumpy .cat-sprite {
            animation: catShake 0.2s infinite alternate;
        }

        /* Abduction Animation States */
        .pixel-cat-container.abducting {
            transform: translateY(-80px) scale(0.6) rotate(15deg);
            opacity: 0.2;
        }

        .pixel-cat-container.abducted-hidden {
            opacity: 0;
            transform: translateY(-120px) scale(0.1);
        }

        @keyframes idleBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        @keyframes catJump {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-16px) scale(1.2); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes catSleep {
            from { transform: scaleY(0.9) translateY(2px); }
            to { transform: scaleY(1.05) translateY(0px); }
        }

        @keyframes catShake {
            0% { transform: translateX(-3px); }
            100% { transform: translateX(3px); }
        }

        /* Retro Cat Speech Bubble */
        .cat-bubble {
            position: absolute;
            top: -28px;
            background: #ffffff;
            color: #000000;
            font-size: 0.45rem;
            padding: 4px 6px;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(4px);
            pointer-events: none;
            transition: opacity 0.15s, transform 0.15s;
        }

        .cat-bubble.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Floating Flying UFO Abduction Rig */
        .ufo-easter-egg {
            position: absolute;
            top: -120px;
            right: 18px;
            font-size: 2.2rem;
            z-index: 20;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(-30px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .ufo-easter-egg.visible {
            opacity: 1;
            transform: translateY(0);
            animation: ufoHover 1.5s infinite alternate ease-in-out;
        }

        @keyframes ufoHover {
            from { transform: translateY(0px); }
            to { transform: translateY(-8px); }
        }

        /* UFO Tractor Beam */
        .alien-beam {
            width: 50px;
            height: 90px;
            margin-top: -6px;
            background: linear-gradient(to bottom, rgba(80, 250, 123, 0.85), rgba(80, 250, 123, 0.05));
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
            display: none;
            pointer-events: none;
            animation: beamPulse 0.2s infinite alternate;
        }

        .ufo-easter-egg.beaming .alien-beam {
            display: block;
        }

        @keyframes beamPulse {
            from { opacity: 0.7; }
            to { opacity: 1.0; }
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-block;
            font-size: 0.5rem;
            color: #a5b4fc;
            background: #1e1b4b;
            border: 2px solid #6366f1;
            box-shadow: 2px 2px 0px #000000;
            padding: 6px 12px;
            margin-bottom: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.05s;
        }

        .brand-badge:active {
            transform: scale(0.95);
        }

        h1 {
            font-size: 1.2rem;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 12px;
            text-shadow: 3px 3px 0px #000000;
            cursor: pointer;
            user-select: none;
        }

        .meta {
            color: #94a3b8;
            font-size: 0.55rem;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000000;
        }

        /* Control Panel */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            background: #11111a;
            padding: 14px;
            border: 3px solid #475569;
            box-shadow: 
                0 0 0 3px #000000,
                4px 4px 0px #000000;
        }

        .btn, .date-input {
            font-family: 'Press Start 2P', monospace;
            background: #1e293b;
            border: 3px solid #ffffff;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 0.55rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000000;
            transition: transform 0.05s, background-color 0.05s;
        }

        .btn:hover:not(:disabled) {
            background: #334155;
            color: #a5b4fc;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }

        .btn:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #475569;
        }

        .btn-ufo {
            background: #059669;
            border-color: #34d399;
            color: #ffffff;
        }

        .btn-ufo:hover:not(:disabled) {
            background: #10b981;
            color: #ffffff;
        }

        .btn-download {
            background: #4f46e5;
            border-color: #a5b4fc;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-download:hover {
            background: #6366f1;
            color: #ffffff;
        }

        .date-input {
            color-scheme: dark;
            background: #0f172a;
        }

        .kbd-legend {
            text-align: center;
            font-size: 0.45rem;
            color: #64748b;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* Pixelated Media Frame */
        .media-wrapper {
            position: relative;
            width: 100%;
            background: #000000;
            border: 4px solid #6366f1;
            box-shadow: 
                0 0 0 4px #000000,
                6px 6px 0px #000000;
            margin: 24px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            cursor: pointer;
            user-select: none;
        }

        .media-wrapper img {
            width: 100%;
            max-height: 520px;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
        }

        .media-wrapper iframe {
            width: 100%;
            height: 420px;
            border: none;
        }

        .explanation {
            font-size: 0.55rem;
            line-height: 2;
            color: #e2e8f0;
            background: #0f172a;
            padding: 20px;
            border: 3px solid #ffffff;
            box-shadow: 
                0 0 0 3px #000000,
                4px 4px 0px #000000;
        }

        .status {
            text-align: center;
            padding: 40px;
            font-size: 0.6rem;
            color: #818cf8;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

    <script type="module">
        const API_KEY = "paste your key here";
        const START_DATE = new Date("1995-06-16");
        
        let currentDate = new Date();

        const app = document.getElementById('app');
        const bgContainer = document.getElementById('bg-container');
        const subMeta = document.getElementById('subMeta');
        const datePicker = document.getElementById('datePicker');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const ufoBtn = document.getElementById('ufoBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const crtToggle = document.getElementById('crtToggle');
        const brandBadge = document.getElementById('brandBadge');
        const mainTitle = document.getElementById('mainTitle');
        const ufo = document.getElementById('ufo');
        const partyBanner = document.getElementById('partyBanner');
        const pixelCat = document.getElementById('pixelCat');
        const catBubble = document.getElementById('catBubble');

        /* Dynamic Audio Synthesizer (Web Audio API) */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        /* Real Recorded Cat Purr Audio File */
        const realCatPurrAudio = new Audio('https://actions.google.com/sounds/v1/animals/cat_purr.ogg');

        function playPurrSound() {
            realCatPurrAudio.currentTime = 0;
            realCatPurrAudio.play().catch(err => {
                console.log("Audio playback prevented until user interaction:", err);
            });
        }

        /* Expanded Sound FX Engine */
        function playMeowSound(type = 0) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc.type = 'triangle';

            if (type === 'abduct') { // Dramatic distressed space meow
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.3);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.6);
                osc.frequency.exponentialRampToValueAtTime(1600, now + 0.9);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.25, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 1.1);
                return;
            }

            if (type === 1) { // High pitch happy meow
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.3);
            } else if (type === 2) { // Squeak meow
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
            } else { // Standard meow
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.35);
            }

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playHissSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 1500;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
        }

        function playUfoBeamSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            const now = audioCtx.currentTime;

            for (let i = 0; i < 12; i++) {
                osc.frequency.setValueAtTime(200 + (i % 2 === 0 ? 400 : 150), now + (i * 0.1));
            }

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.4);
        }

        function playCatJingle() {
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                setTimeout(() => playBlipSound(freq, 'triangle'), idx * 70);
            });
        }

        function playBlipSound(freq = 520, type = 'square') {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            const now = audioCtx.currentTime;

            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq / 2, now + 0.08);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        }

        function playFanfareSound() {
            initAudio();
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            notes.forEach((freq, idx) => {
                setTimeout(() => playBlipSound(freq, 'triangle'), idx * 80);
            });
        }

        /* Interactive Pixel Particle System */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createPixelParticles(x, y, count = 16, shape = 'square', customColors = null) {
            const colors = customColors || ['#818cf8', '#a5b4fc', '#6366f1', '#ffffff', '#ffb86c', '#ff79c6', '#50fa7b'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10 - 2,
                    size: Math.floor(Math.random() * 5) + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    shape: shape,
                    life: 1
                });
            }
        }

        function updateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);

                if (p.shape === 'heart') {
                    ctx.font = `${p.size * 3}px monospace`;
                    ctx.fillText('♥', p.x, p.y);
                } else if (p.shape === 'fish') {
                    ctx.font = `${p.size * 4}px monospace`;
                    ctx.fillText('🐟', p.x, p.y);
                } else {
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }

                if (p.life <= 0) {
                    particles.splice(idx, 1);
                }
            });
            requestAnimationFrame(updateParticles);
        }
        updateParticles();

        window.addEventListener('click', (e) => {
            resetIdleTimer();
            createPixelParticles(e.clientX, e.clientY, 10);
        });

        /* CRT Toggle Logic */
        crtToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playBlipSound(700);
            document.body.classList.toggle('crt');
            const isCrt = document.body.classList.contains('crt');
            crtToggle.textContent = isCrt ? '[CRT: ON]' : '[CRT: OFF]';
        });

        /* Interactive Cat Setup */
        const meowPhrases = ["MEOW!", "PURR...", "MEOW3!!", "PURR-FECT!", "SPACE CAT!", "CHIRP!"];

        let idleTimer = null;
        let isCatSleeping = false;
        let catInteractionCount = 0;
        let rapidTapTimer = null;
        let tapFrequency = 0;
        let isAbducting = false;

        function resetIdleTimer() {
            if (isCatSleeping && !isAbducting) {
                isCatSleeping = false;
                pixelCat.classList.remove('sleeping');
                catBubble.textContent = "WOKE UP!";
                catBubble.classList.add('active');
                setTimeout(() => catBubble.classList.remove('active'), 1200);
            }
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!isAbducting) {
                    isCatSleeping = true;
                    pixelCat.classList.add('sleeping');
                    catBubble.textContent = "Zzz...";
                    catBubble.classList.add('active');
                }
            }, 12000);
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('keydown', resetIdleTimer);
        resetIdleTimer();

        function triggerCatInteraction() {
            if (isAbducting) return;

            catInteractionCount++;
            tapFrequency++;

            clearTimeout(rapidTapTimer);
            rapidTapTimer = setTimeout(() => { tapFrequency = 0; }, 1500);

            const rect = pixelCat.getBoundingClientRect();

            // Grumpy state if tapped rapidly
            if (tapFrequency > 6) {
                playHissSound();
                pixelCat.classList.add('grumpy');
                showBubbleMsg("HISS! 😾");
                createPixelParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 12, 'square', ['#ff5555']);
                setTimeout(() => pixelCat.classList.remove('grumpy'), 1000);
                return;
            }

            // Fish Snack Easter Egg trigger every 10 clicks
            if (catInteractionCount % 10 === 0) {
                playPurrSound();
                playCatJingle();
                createPixelParticles(rect.left + rect.width / 2, rect.top - 20, 10, 'fish');
                showBubbleMsg("🐟 YUM! FISH!");
                return;
            }

            // Standard sound variation
            const randAudio = Math.floor(Math.random() * 3);
            if (randAudio === 0) playMeowSound(0);
            else if (randAudio === 1) playMeowSound(1);
            else playPurrSound();

            createPixelParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 22);

            pixelCat.classList.remove('meow-jump', 'sleeping', 'grumpy');
            isCatSleeping = false;
            void pixelCat.offsetWidth;
            pixelCat.classList.add('meow-jump');

            const randomPhrase = meowPhrases[Math.floor(Math.random() * meowPhrases.length)];
            catBubble.textContent = randomPhrase;
            catBubble.classList.add('active');

            setTimeout(() => {
                catBubble.classList.remove('active');
            }, 1200);
        }

        pixelCat.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerCatInteraction();
        });

        /* Ultimate UFO Cat Abduction Feature */
        function triggerAlienAbduction() {
            if (isAbducting) return;
            isAbducting = true;

            // 1. Reveal UFO hover
            ufo.classList.add('visible');
            showBubbleMsg("🛸 UFO APPROACHING!");
            playUfoBeamSound();

            setTimeout(() => {
                // 2. Fire Tractor Beam & start cat float up
                ufo.classList.add('beaming');
                showBubbleMsg("MEOWWW?! 🙀");
                playMeowSound('abduct');

                const rect = pixelCat.getBoundingClientRect();
                createPixelParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 25, 'square', ['#50fa7b', '#818cf8', '#ffffff']);

                pixelCat.classList.remove('sleeping', 'meow-jump', 'grumpy');
                pixelCat.classList.add('abducting');
            }, 800);

            setTimeout(() => {
                // 3. Cat disappears inside UFO
                pixelCat.classList.remove('abducting');
                pixelCat.classList.add('abducted-hidden');
                showBubbleMsg("ABDUCTED! 🌌");
                playCatJingle();
            }, 2200);

            setTimeout(() => {
                // 4. Turn off beam & bring cat back safely
                ufo.classList.remove('beaming');
                showBubbleMsg("RETURNED! 😸");
                playMeowSound(1);

                pixelCat.classList.remove('abducted-hidden');
                const rect = pixelCat.getBoundingClientRect();
                createPixelParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 30, 'heart', ['#ff79c6', '#a5b4fc', '#ffffff']);
                
                pixelCat.classList.add('meow-jump');
                setTimeout(() => pixelCat.classList.remove('meow-jump'), 400);

                setTimeout(() => {
                    ufo.classList.remove('visible');
                    isAbducting = false;
                }, 1000);
            }, 3600);
        }

        ufoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerAlienAbduction();
        });

        ufo.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerAlienAbduction();
        });

        /* Brand Badge Click Easter Egg */
        let badgeClickCount = 0;
        brandBadge.addEventListener('click', (e) => {
            e.stopPropagation();
            badgeClickCount++;
            playBlipSound(300 + badgeClickCount * 100);

            if (badgeClickCount >= 5) {
                badgeClickCount = 0;
                triggerAlienAbduction();
            } else {
                showBubbleMsg(`TAP ${5 - badgeClickCount}x FOR UFO!`);
            }
        });

        /* Title Glitch Easter Egg */
        let titleClicks = 0;
        const originalTitleText = "ASTRONOMY PICTURE OF THE DAY";
        const alienText = "👾 ASTR0-CAT-X90-COSMOS 👾";

        mainTitle.addEventListener('click', () => {
            titleClicks++;
            playBlipSound(600 + titleClicks * 80, 'sawtooth');

            if (titleClicks % 3 === 0) {
                mainTitle.textContent = alienText;
                mainTitle.style.color = "#ff79c6";
            } else {
                mainTitle.textContent = originalTitleText;
                mainTitle.style.color = "#ffffff";
            }
        });

        /* Hyperspace Warp Speed Easter Egg */
        function triggerWarpSpeed() {
            playFanfareSound();
            document.body.classList.add('warp-mode');
            showBubbleMsg("HYPERSPACE!");

            setTimeout(() => {
                document.body.classList.remove('warp-mode');
            }, 2500);
        }

        function showBubbleMsg(text) {
            catBubble.textContent = text;
            catBubble.classList.add('active');
            setTimeout(() => catBubble.classList.remove('active'), 1500);
        }

        /* Konami Code Secret Party Mode */
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiIndex = 0;

        window.addEventListener('keydown', (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            const requiredKey = konamiCode[konamiIndex].toLowerCase();

            if (key === requiredKey) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    konamiIndex = 0;
                    activatePartyMode();
                }
            } else {
                konamiIndex = 0;
            }
        });

        function activatePartyMode() {
            playFanfareSound();
            document.body.classList.toggle('party-mode');
            partyBanner.style.display = 'block';

            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const randomX = Math.random() * window.innerWidth;
                    const randomY = Math.random() * (window.innerHeight / 2);
                    createPixelParticles(randomX, randomY, 40);
                }, i * 250);
            }

            setTimeout(() => {
                partyBanner.style.display = 'none';
            }, 5000);
        }

        /* APOD Functions */
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        const todayStr = formatDate(new Date());
        datePicker.max = todayStr;
        datePicker.min = "1995-06-16";

        async function fetchAPOD(dateStr) {
            app.innerHTML = `<div class="status">LOADING DATA [${dateStr}]...</div>`;
            downloadBtn.style.display = "none";

            checkSpecialDateEasterEgg(dateStr);

            const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${dateStr}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) throw new Error(data.msg || "FETCH ERROR");

                const mediaUrl = data.hdurl || data.url;

                if (data.media_type === 'image') {
                    bgContainer.style.backgroundImage = `url('${mediaUrl}')`;
                } else {
                    bgContainer.style.backgroundImage = 'none';
                }

                subMeta.textContent = `${data.date} • NASA APOD`;

                app.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h2 style="font-size: 0.75rem; color: #818cf8; line-height: 1.6; text-shadow: 2px 2px 0px #000000;">${data.title}</h2>
                    </div>

                    <div class="media-wrapper" id="mediaWrapper" title="Double-click for a cute surprise!">
                        ${data.media_type === 'video' 
                            ? `<iframe src="${data.url}" allowfullscreen></iframe>`
                            : `<img src="${mediaUrl}" alt="${data.title}">`
                        }
                    </div>

                    <p class="explanation">${data.explanation}</p>
                `;

                if (data.media_type === 'image') {
                    downloadBtn.href = mediaUrl;
                    downloadBtn.download = `APOD_${data.date}.jpg`;
                    downloadBtn.style.display = "inline-flex";
                }

                /* Double Click Image Love Burst */
                const mediaWrapper = document.getElementById('mediaWrapper');
                if (mediaWrapper) {
                    mediaWrapper.addEventListener('dblclick', (e) => {
                        playFanfareSound();
                        createPixelParticles(e.clientX, e.clientY, 30, 'heart', ['#ff79c6', '#ff5555', '#ffffff']);
                        showBubbleMsg("COSMIC LOVE! ♥");
                    });
                }

                datePicker.value = data.date;
                currentDate = new Date(data.date);
                updateButtonStates();

            } catch (err) {
                app.innerHTML = `<div class="status error">ERROR: ${err.message}</div>`;
            }
        }

        /* Date-based Easter Eggs */
        function checkSpecialDateEasterEgg(dateStr) {
            const [year, month, day] = dateStr.split('-');
            
            if (month === '06' && day === '16') {
                showBubbleMsg("🎂 APOD B-DAY!");
                playFanfareSound();
            } else if (month === '10' && day === '31') {
                showBubbleMsg("🎃 SPOOKY SPACE!");
                playHissSound();
            } else if (month === '02' && day === '14') {
                showBubbleMsg(" SPACE VALENTINE!");
                createPixelParticles(window.innerWidth / 2, 100, 25, 'heart');
            }
        }

        function updateButtonStates() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const current = new Date(currentDate);
            current.setHours(0, 0, 0, 0);

            nextBtn.disabled = current >= today;
            prevBtn.disabled = current <= START_DATE;
        }

        prevBtn.addEventListener('click', () => {
            if (prevBtn.disabled) return;
            playBlipSound(440);
            currentDate.setDate(currentDate.getDate() - 1);
            fetchAPOD(formatDate(currentDate));
        });

        nextBtn.addEventListener('click', () => {
            if (nextBtn.disabled) return;
            playBlipSound(660);
            currentDate.setDate(currentDate.getDate() + 1);
            fetchAPOD(formatDate(currentDate));
        });

        datePicker.addEventListener('change', (e) => {
            if (e.target.value) {
                playBlipSound(550);
                currentDate = new Date(e.target.value);
                fetchAPOD(e.target.value);
            }
        });

        randomBtn.addEventListener('click', () => {
            playBlipSound(880);
            const startTimestamp = START_DATE.getTime();
            const endTimestamp = new Date().getTime();
            const randomTimestamp = startTimestamp + Math.random() * (endTimestamp - startTimestamp);
            
            currentDate = new Date(randomTimestamp);
            fetchAPOD(formatDate(currentDate));
        });

        downloadBtn.addEventListener('click', () => {
            playBlipSound(750);
        });

        /* Extended Keyboard Shortcuts */
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                prevBtn.click();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                nextBtn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                randomBtn.click();
            } else if (e.key === ' ' || e.key === 'c' || e.key === 'C') {
                e.preventDefault();
                triggerCatInteraction();
            } else if (e.key === 'p' || e.key === 'P') {
                playPurrSound();
                showBubbleMsg("PURRR... 💜");
            } else if (e.key === 'h' || e.key === 'H' || e.key === 'w' || e.key === 'W') {
                triggerWarpSpeed();
            } else if (e.key === 'i' || e.key === 'I' || e.key === 'u' || e.key === 'U') {
                triggerAlienAbduction();
            }
        });

        fetchAPOD(todayStr);
    </script>
</body>
</html>
