<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube — NASA APOD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0f;
      --surface: #12141c;
      --border: #1e2230;
      --text: #e8eaef;
      --muted: #8b92a5;
      --accent: #7c9cff; 
      --accent-dim: #3d4f8a;
      --danger: #e86c6c;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* soft starfield, not competing with content */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.25), transparent),
        radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.3), transparent),
        radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.2), transparent);
      background-size: 100% 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 1.75rem;
    }

    .brand {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .btn, .date-input {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #151822;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #dbe4ff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #4a5fa8;
    }

    .date-input {
      color-scheme: dark;
      min-width: 9.5rem;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: auto;
    }

    @media (max-width: 560px) {
      .hint { display: none; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .status {
      padding: 3rem 1.5rem;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .title {
      padding: 1.25rem 1.25rem 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .media {
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .media img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 70vh;
      object-fit: contain;
    }

    .media iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }

    .explanation {
      padding: 1.25rem;
      font-size: 0.95rem;
      color: #c5cad6;
      line-height: 1.65;
    }

    .footer-bar {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem 1.25rem;
      flex-wrap: wrap;
    }

    .footer-bar a.btn {
      text-decoration: none;
    }

    /* optional subtle CRT — off by default */
    body.crt::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      pointer-events: none;
      z-index: 50;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">cube</div>
      <h1>Astronomy Picture of the Day</h1>
      <p class="meta" id="subMeta">loading…</p>
    </header>

    <div class="controls">
      <button class="btn" id="prevBtn" title="Previous day (←)">← prev</button>
      <input type="date" class="date-input" id="datePicker">
      <button class="btn" id="nextBtn" title="Next day (→)">next →</button>
      <button class="btn btn-primary" id="randomBtn" title="Random (R)">random</button>
      <button class="btn" id="crtBtn" title="Toggle scanlines">crt</button>
      <span class="hint">← → · R random</span>
    </div>

    <div class="card">
      <div id="app">
        <div class="status">connecting to NASA…</div>
      </div>
      <div class="footer-bar" id="footerBar" style="display:none">
        <a class="btn" id="downloadBtn" href="#" download style="display:none">download</a>
        <a class="btn" id="nasaLink" href="#" target="_blank" rel="noopener">open on NASA</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    let API_KEY = "DEMO_KEY";
    try {
      if (import.meta?.env?.VITE_NASA_API_KEY) {
        API_KEY = import.meta.env.VITE_NASA_API_KEY;
      }
    } catch (_) {}

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d, 12, 0, 0);
    }

    const START_DATE = parseDate("1995-06-16");
    let currentDate = new Date();

    const app = document.getElementById("app");
    const subMeta = document.getElementById("subMeta");
    const datePicker = document.getElementById("datePicker");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const randomBtn = document.getElementById("randomBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const nasaLink = document.getElementById("nasaLink");
    const footerBar = document.getElementById("footerBar");
    const toast = document.getElementById("toast");

    const todayStr = formatDate(new Date());
    datePicker.max = todayStr;
    datePicker.min = "1995-06-16";

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function updateButtons() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const cur = new Date(currentDate);
      cur.setHours(0, 0, 0, 0);
      nextBtn.disabled = cur >= today;
      prevBtn.disabled = cur <= START_DATE;
    }

    function escapeHtml(s) { 
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function fetchAPOD(dateStr) {
      app.innerHTML = `<div class="status">loading ${dateStr}…</div>`;
      footerBar.style.display = "none";
      downloadBtn.style.display = "none";

      const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${dateStr}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error?.message || "request failed");

        const mediaUrl = data.hdurl || data.url;
        subMeta.textContent = `${data.date} · NASA APOD`;

        const mediaHtml =
          data.media_type === "video"
            ? `<iframe src="${escapeHtml(data.url)}" allowfullscreen title="APOD video"></iframe>`
            : `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(data.title)}" loading="eager">`;

        app.innerHTML = `
          <div class="title">${escapeHtml(data.title)}</div>
          <div class="media">${mediaHtml}</div>
          <p class="explanation">${escapeHtml(data.explanation)}</p>
        `;

        footerBar.style.display = "flex";
        nasaLink.href = `https://apod.nasa.gov/apod/ap${dateStr.slice(2).replace(/-/g, "")}.html`;

        if (data.media_type === "image") {
          downloadBtn.href = mediaUrl;
          downloadBtn.download = `APOD_${data.date}.jpg`;
          downloadBtn.style.display = "inline-block";
        }

        datePicker.value = data.date;
        currentDate = parseDate(data.date);
        updateButtons();
      } catch (err) {
        app.innerHTML = `<div class="status error">${escapeHtml(err.message)}</div>`;
        subMeta.textContent = "error";
      }
    }

    prevBtn.addEventListener("click", () => {
      if (prevBtn.disabled) return;
      currentDate.setDate(currentDate.getDate() - 1);
      fetchAPOD(formatDate(currentDate));
    });

    nextBtn.addEventListener("click", () => {
      if (nextBtn.disabled) return;
      currentDate.setDate(currentDate.getDate() + 1);
      fetchAPOD(formatDate(currentDate));
    });

    datePicker.addEventListener("change", (e) => {
      if (!e.target.value) return;
      currentDate = parseDate(e.target.value);
      fetchAPOD(e.target.value);
    });

    randomBtn.addEventListener("click", () => {
      const start = START_DATE.getTime();
      const end = Date.now();
      currentDate = new Date(start + Math.random() * (end - start));
      fetchAPOD(formatDate(currentDate));
    });

    document.getElementById("crtBtn").addEventListener("click", () => {
      document.body.classList.toggle("crt");
      showToast(document.body.classList.contains("crt") ? "crt on" : "crt off");
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "INPUT") return;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") prevBtn.click();
      else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") nextBtn.click();
      else if (e.key === "r" || e.key === "R") randomBtn.click();
    });

    fetchAPOD(todayStr);
  </script>
</body>
</html>
